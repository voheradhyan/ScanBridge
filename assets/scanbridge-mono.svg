<!--
  ScanBridge, single colour on a transparent ground.

  For places that supply their own background and their own colour: documentation, a README
  header, a print, anywhere the tile would fight what is around it. Uses currentColor, so it
  takes the colour of the text it sits in.

  Not for the tray. There the tile version is correct, because a bare glyph has to survive a
  light taskbar, a dark one and an accent colour, and this one cannot.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     fill="none" stroke="currentColor" role="img" aria-label="ScanBridge">
  <g stroke-width="16" stroke-linecap="round">
    <path d="M112 168V128a16 16 0 0 1 16-16h48"/>
    <path d="M344 112h40a16 16 0 0 1 16 16v40"/>
    <path d="M112 344v40a16 16 0 0 0 16 16h48"/>
    <path d="M344 400h40a16 16 0 0 0 16-16v-40"/>
  </g>

  <g stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="16" d="M112 273H400"/>
    <path stroke-width="16" d="M118 253
      C153 245 170 225 178 202
      C195 224 220 239 256 239
      C292 239 317 224 334 202
      C342 225 359 245 394 253"/>
    <path stroke-width="16" d="M178 177V273 M334 177V273"/>
    <path stroke-width="7" d="M210 225V273 M302 225V273 M256 239V273"/>
  </g>

  <g fill="currentColor" stroke="none">
    <rect x="207" y="297" width="98" height="10" rx="5"/>
    <rect x="194" y="323" width="124" height="10" rx="5"/>
    <rect x="181" y="349" width="150" height="10" rx="5"/>
  </g>
</svg>
